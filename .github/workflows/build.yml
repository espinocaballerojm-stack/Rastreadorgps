name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        run: |
          curl -sL -o g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q g.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para descargar
        run: |
          gh release create "v${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "APK v${{ github.run_number }}" \
            --notes "Descarga este archivo e instalalo en los moviles."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
